<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rudyferd AI Image Studio</title>
  <style>
    body { font-family: sans-serif; max-width: 520px; margin: 15px auto; padding: 15px; background: #121212; color: #fff; text-align: center; }
    .kotak { background: #1e1e1e; padding: 12px; border-radius: 8px; margin-bottom: 12px; text-align: left; font-size: 14px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; color: #eee; }
    select, input[type="file"] { width: 100%; box-sizing: border-box; }
    select { padding: 10px; border-radius: 6px; border: none; background: #2c2c2c; color: #fff; font-size: 14px; }
    .baris-dua { display: flex; gap: 10px; }
    .baris-dua > div { flex: 1; }
    input[type="file"] { color: #ccc; padding: 6px 0; }
    #pratinjau { max-width: 160px; max-height: 160px; margin-top: 10px; border-radius: 6px; border: 1px solid #444; display: none; }
    textarea { width: 100%; height: 95px; padding: 10px; border-radius: 8px; border: none; font-size: 15px; box-sizing: border-box; }
    button { width: 100%; padding: 13px; margin-top: 10px; background: #ff9d00; color: #000; font-weight: bold; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; }
    button:disabled { background: #555; color: #aaa; }
    .btn-hapus { background: #333; color: #fff; font-size: 12px; padding: 6px 12px; width: auto; margin-top: 8px; display: none; }
    .btn-unduh { background: #28a745; color: #fff; font-size: 14px; padding: 10px; margin-top: 8px; display: inline-block; text-decoration: none; border-radius: 6px; font-weight: bold; width: 100%; box-sizing: border-box; }
    #galeri-hasil { margin-top: 15px; }
    .kartu-hasil { background: #1e1e1e; padding: 10px; border-radius: 8px; margin-bottom: 12px; }
    .kartu-hasil img { width: 100%; border-radius: 6px; display: block; }
    .info-res { font-size: 12px; color: #aaa; margin-top: 6px; }
    #status { margin-top: 10px; font-size: 14px; color: #ffd166; font-weight: bold; }
    .tips { font-size: 12px; color: #aaa; margin-top: 6px; line-height: 1.4; }
    #galeri-riwayat { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
    .item-riwayat { background: #262626; padding: 6px; border-radius: 6px; text-align: center; }
    .item-riwayat img { width: 100%; border-radius: 4px; }
    .item-riwayat small { display: block; font-size: 11px; color: #999; margin-top: 4px; }
  </style>
</head>
<body>
  <h2>Rudyferd AI Studio</h2>

  <div class="kotak baris-dua">
    <div>
      <label for="rasio">Rasio Gambar:</label>
      <select id="rasio">
        <option value="1024,1024">1:1 Kotak</option>
        <option value="768,1344">9:16 Portrait</option>
        <option value="1344,768">16:9 Landscape</option>
        <option value="832,1216">3:4 Foto</option>
        <option value="1152,896">4:3 Standar</option>
        <option value="1216,832">3:2 Kamera</option>
      </select>
    </div>
    <div>
      <label for="resolusi">Resolusi Output:</label>
      <select id="resolusi">
        <option value="1">1x (1 MP - Standar HD)</option>
        <option value="2">2x (4 MP - Tajam)</option>
        <option value="4">4x (16 MP - Ultra HD)</option>
        <option value="5.6">6x (32 MP - Maksimal)</option>
      </select>
    </div>
  </div>

  <div class="kotak">
    <label for="gaya">Gaya Gambar:</label>
    <select id="gaya">
      <option value="photorealistic, ultra detailed, sharp focus, 8k uhd, natural lighting">Foto Realistis Tajam</option>
      <option value="anime style, vibrant colors, clean lineart, high quality illustration">Anime / Ilustrasi</option>
      <option value="3d render, unreal engine 5, cinema4d, sharp focus, detailed textures">3D Animasi</option>
      <option value="">Sesuai Teks Saja</option>
    </select>
  </div>

  <div class="kotak">
    <label for="fileGambar">Gambar Acuan Karakter (Opsional):</label>
    <input type="file" id="fileGambar" accept="image/*" />
    <img id="pratinjau" alt="Pratinjau Gambar" />
    <button type="button" id="btnHapus" class="btn-hapus">Hapus Gambar Acuan</button>
    
    <div id="opsiAcuan" style="display:none; margin-top:10px;">
      <label for="modeAcuan">Mode Peniruan Gambar Acuan:</label>
      <select id="modeAcuan">
        <option value="karakter">Copy Karakter ke Pose & Tempat Baru</option>
        <option value="struktur">Ikuti Pose & Komposisi Foto Asli</option>
      </select>
      <div class="tips">Tulis ciri karakter + pose + tempat baru di kotak teks (bahasa Inggris).</div>
    </div>
  </div>

  <textarea id="prompt" placeholder="Tulis perintah detail dalam bahasa Inggris... (Contoh: a young man wearing a chef uniform cooking in a busy restaurant kitchen, cinematic lighting)"></textarea>
  <button type="button" id="btnBuat">Buat Gambar</button>
  <div id="status">Siap digunakan.</div>
  <div id="galeri-hasil"></div>

  <div class="kotak" style="margin-top: 20px;">
    <label>Riwayat 10 Foto Terakhir (Terhapus otomatis dalam 7 hari):</label>
    <div id="galeri-riwayat"></div>
  </div>

  <script>
    const API_URL = 'https:' + '//aihorde.net/api/v2/generate/async';
    const STATUS_URL = 'https:' + '//aihorde.net/api/v2/generate/status/';
    const KUNCI_RIWAYAT = 'rudyferd_ai_riwayat_v2';
    const BATAS_HARI_MS = 7 * 24 * 60 * 60 * 1000;
    let fileTerpilih = null;

    document.getElementById('fileGambar').addEventListener('change', function(e) {
      const files = e.target.files;
      if (files && files.length > 0) {
        fileTerpilih = files.item(0);
        const reader = new FileReader();
        reader.onload = function(ev) {
          const pratinjau = document.getElementById('pratinjau');
          pratinjau.src = ev.target.result;
          pratinjau.style.display = 'block';
          document.getElementById('btnHapus').style.display = 'inline-block';
          document.getElementById('opsiAcuan').style.display = 'block';
        };
        reader.readAsDataURL(fileTerpilih);
      }
    });

    document.getElementById('btnHapus').addEventListener('click', function() {
      fileTerpilih = null;
      document.getElementById('fileGambar').value = '';
      document.getElementById('pratinjau').style.display = 'none';
      document.getElementById('btnHapus').style.display = 'none';
      document.getElementById('opsiAcuan').style.display = 'none';
    });

    function ubahUkuranKeBase64(file, lebar, tinggi) {
      return new Promise(function(resolve) {
        const reader = new FileReader();
        reader.onload = function(ev) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            canvas.width = lebar;
            canvas.height = tinggi;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, lebar, tinggi);
            const dataUrl = canvas.toDataURL('image/webp', 0.88);
            resolve(dataUrl.substring(dataUrl.indexOf(',') + 1));
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function perbesarResolusi(sumberUrl, skala) {
      return new Promise(function(resolve) {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function() {
          const targetW = Math.round(img.width * skala);
          const targetH = Math.round(img.height * skala);
          const canvas = document.createElement('canvas');
          canvas.width = targetW;
          canvas.height = targetH;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, targetW, targetH);

          const hasilUrl = canvas.toDataURL('image/jpeg', 0.92);
          const mp = ((targetW * targetH) / 1000000).toFixed(1);

          const thumbCanvas = document.createElement('canvas');
          thumbCanvas.width = 400;
          thumbCanvas.height = Math.round(400 * (img.height / img.width));
          thumbCanvas.getContext('2d').drawImage(img, 0, 0, thumbCanvas.width, thumbCanvas.height);
          const thumbUrl = thumbCanvas.toDataURL('image/jpeg', 0.75);

          resolve({ url: hasilUrl, thumb: thumbUrl, lebar: targetW, tinggi: targetH, mp: mp });
        };
        img.src = sumberUrl;
      });
    }

    function muatRiwayat() {
      const sekarang = Date.now();
      let data = [];
      try {
        data = JSON.parse(localStorage.getItem(KUNCI_RIWAYAT) || '[]');
      } catch (e) { data = []; }

      data = data.filter(function(item) { return (sekarang - item.waktu) < BATAS_HARI_MS; });
      localStorage.setItem(KUNCI_RIWAYAT, JSON.stringify(data));

      const wadah = document.getElementById('galeri-riwayat');
      wadah.innerHTML = '';
      if (data.length === 0) {
        wadah.innerHTML = '<div class="tips">Belum ada riwayat foto tersimpan.</div>';
        return;
      }

      data.forEach(function(item) {
        const sisaHari = Math.ceil((BATAS_HARI_MS - (sekarang - item.waktu)) / (24 * 60 * 60 * 1000));
        const div = document.createElement('div');
        div.className = 'item-riwayat';
        div.innerHTML = '<img src="' + item.url + '" alt="Riwayat" /><small>Hapus otomatis: ' + sisaHari + ' hari lagi</small>';
        wadah.appendChild(div);
      });
    }

    function simpanKeRiwayat(thumbUrl) {
      const sekarang = Date.now();
      let data = [];
      try {
        data = JSON.parse(localStorage.getItem(KUNCI_RIWAYAT) || '[]');
      } catch (e) { data = []; }

      data = data.filter(function(item) { return (sekarang - item.waktu) < BATAS_HARI_MS; });
      data.unshift({ url: thumbUrl, waktu: sekarang });
      if (data.length > 10) data = data.slice(0, 10);

      try {
        localStorage.setItem(KUNCI_RIWAYAT, JSON.stringify(data));
      } catch (e) {
