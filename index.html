<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rudyferd AI Image Generator</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 15px; background: #121212; color: #fff; text-align: center; }
    .kotak-upload { background: #1e1e1e; padding: 12px; border-radius: 8px; margin-bottom: 12px; text-align: left; font-size: 14px; }
    input[type="file"] { width: 100%; margin-top: 8px; color: #ccc; }
    #pratinjau { max-width: 150px; margin-top: 10px; border-radius: 6px; display: none; }
    textarea { width: 100%; height: 90px; padding: 10px; border-radius: 8px; border: none; font-size: 16px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; margin-top: 10px; background: #ff9d00; color: #000; font-weight: bold; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; }
    button:disabled { background: #555; color: #aaa; }
    .btn-hapus { background: #333; color: #fff; font-size: 12px; padding: 6px 10px; width: auto; margin-top: 8px; display: none; }
    #hasil { width: 100%; margin-top: 15px; border-radius: 8px; display: none; }
    #status { margin-top: 10px; font-size: 14px; color: #bbb; }
  </style>
</head>
<body>
  <h2>AI Image Generator</h2>

  <div class="kotak-upload">
    <label for="fileGambar"><strong>Gambar Acuan (Opsional):</strong></label>
    <input type="file" id="fileGambar" accept="image/*" onchange="tampilkanPratinjau()" />
    <img id="pratinjau" alt="Pratinjau Gambar" />
    <button type="button" id="btnHapus" class="btn-hapus" onclick="hapusGambar()">Hapus Gambar Acuan</button>
  </div>

  <textarea id="prompt" placeholder="Ketik deskripsi dalam bahasa Inggris... (Contoh: astronaut cat on the moon, realistic)"></textarea>
  <button id="btn" onclick="buatGambar()">Buat Gambar</button>
  <div id="status">Siap digunakan (AI Horde Gratis).</div>
  <img id="hasil" alt="Hasil Gambar" />

  <script>
    const API_URL = 'https:' + '//aihorde.net/api/v2/generate/async';
    const STATUS_URL = 'https:' + '//aihorde.net/api/v2/generate/status/';

    function tampilkanPratinjau() {
      const file = document.getElementById('fileGambar').files.item(0);
      const pratinjau = document.getElementById('pratinjau');
      const btnHapus = document.getElementById('btnHapus');
      if (file) {
        pratinjau.src = URL.createObjectURL(file);
        pratinjau.style.display = 'block';
        btnHapus.style.display = 'inline-block';
      }
    }

    function hapusGambar() {
      document.getElementById('fileGambar').value = '';
      document.getElementById('pratinjau').style.display = 'none';
      document.getElementById('btnHapus').style.display = 'none';
    }

    function ubahUkuranKeBase64(file) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 512;
          canvas.height = 512;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, 512, 512);
          const dataUrl = canvas.toDataURL('image/webp', 0.85);
          resolve(dataUrl.substring(dataUrl.indexOf(',') + 1));
        };
        img.src = URL.createObjectURL(file);
      });
    }

    async function buatGambar() {
      const prompt = document.getElementById('prompt').value.trim();
      if (!prompt) return alert('Isi deskripsi gambar dulu!');

      const file = document.getElementById('fileGambar').files.item(0);
      const btn = document.getElementById('btn');
      const status = document.getElementById('status');
      const imgHasil = document.getElementById('hasil');

      btn.disabled = true;
      imgHasil.style.display = 'none';
      status.innerText = 'Mengirim perintah ke server AI Horde...';

      try {
        const payload = {
          prompt: prompt,
          params: {
            width: 512,
            height: 512,
            steps: 20,
            n: 1
          },
          nsfw: false
        };

        if (file) {
          status.innerText = 'Menyiapkan gambar acuan...';
          payload.source_image = await ubahUkuranKeBase64(file);
          payload.source_processing = 'img2img';
          payload.params.denoising_strength = 0.65;
        }

        const res = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': '0000000000'
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!data.id) throw new Error(data.message || 'Gagal memulai antrean.');

        const jobId = data.id;
        let selesai = false;

        while (!selesai) {
          await new Promise(r => setTimeout(r, 3000));
          const cekRes = await fetch(STATUS_URL + jobId);
          const cekData = await cekRes.json();

          if (cekData.done && cekData.generations && cekData.generations.length > 0) {
            const gen = cekData.generations.item ? cekData.generations.item(0) : cekData.generations;
            const imgData = Array.isArray(cekData.generations) ? cekData.generations.shift().img : gen.img;
            imgHasil.src = imgData.startsWith('http') ? imgData : 'data:image/webp;base64,' + imgData;
            imgHasil.style.display = 'block';
            status.innerText = 'Selesai! Tekan dan tahan gambar untuk menyimpan ke HP.';
            selesai = true;
          } else {
            const antrean = cekData.queue_position || 0;
            const tunggu = cekData.wait_time || 15;
            status.innerText = `Sedang diproses... Posisi antrean: ${antrean} (estimasi ${tunggu} detik)`;
          }
        }
      } catch (err) {
        status.innerText = 'Gagal: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
