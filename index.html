<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rudyferd AI Studio</title>
<style>
body{font-family:sans-serif;max-width:500px;margin:10px auto;padding:12px;background:#121212;color:#fff;text-align:center}
.box{background:#1e1e1e;padding:10px;border-radius:8px;margin-bottom:10px;text-align:left;font-size:13px}
.row{display:flex;gap:8px}.row>div{flex:1}
label{display:block;margin-bottom:4px;font-weight:bold}
select,textarea,button{width:100%;box-sizing:border-box;border-radius:6px;border:none;font-size:14px}
select{padding:9px;background:#2c2c2c;color:#fff}
textarea{height:85px;padding:10px;margin-bottom:8px}
button{padding:12px;background:#ff9d00;color:#000;font-weight:bold;font-size:15px;cursor:pointer}
button:disabled{background:#555;color:#aaa}
#prev{max-width:120px;margin-top:8px;border-radius:6px;display:none}
.btn-del{background:#333;color:#fff;font-size:11px;padding:5px 8px;width:auto;margin-top:6px;display:none}
.btn-dl{display:block;background:#28a745;color:#fff;padding:9px;margin-top:6px;border-radius:6px;text-decoration:none;font-weight:bold}
#hasil img{width:100%;border-radius:8px;margin-top:10px}
#riwayat{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
#riwayat div{background:#262626;padding:5px;border-radius:6px;font-size:10px;color:#aaa}
#riwayat img{width:100%;border-radius:4px}
#stat{margin:8px 0;font-size:13px;color:#ffd166;font-weight:bold}
</style>
</head>
<body>
<h3>Rudyferd AI Studio</h3>
<div class="box row">
  <div><label>Rasio:</label><select id="rasio"><option value="1024,1024">1:1 Kotak</option><option value="768,1344">9:16 Story</option><option value="1344,768">16:9 Lebar</option><option value="832,1216">3:4 Foto</option><option value="1152,896">4:3 Standar</option><option value="1216,832">3:2 Kamera</option></select></div>
  <div><label>Resolusi:</label><select id="res"><option value="1">1x (1 MP)</option><option value="2">2x (4 MP)</option><option value="4">4x (16 MP)</option><option value="5.6">6x (32 MP)</option></select></div>
</div>
<div class="box"><label>Gaya:</label><select id="gaya"><option value="photorealistic, ultra detailed, sharp focus, 8k">Foto Realistis Tajam</option><option value="anime style, vibrant, clean lineart">Anime / Ilustrasi</option><option value="3d render, unreal engine 5, detailed">3D Animasi</option><option value="">Sesuai Teks Saja</option></select></div>
<div class="box">
  <label>Gambar Acuan Karakter (Opsional):</label>
  <input type="file" id="fImg" accept="image/*">
  <img id="prev"><button type="button" id="bDel" class="btn-del">Hapus Foto</button>
  <div id="mBox" style="display:none;margin-top:8px"><label>Mode Acuan:</label><select id="mode"><option value="kar">Copy Karakter ke Pose/Tempat Baru</option><option value="str">Ikuti Pose Foto Asli</option></select></div>
</div>
<textarea id="prm" placeholder="Tulis perintah bahasa Inggris... (Contoh: young man wearing chef uniform cooking in restaurant kitchen)"></textarea>
<button type="button" id="bRun">Buat Gambar</button>
<div id="stat">Siap digunakan.</div>
<div id="hasil"></div>
<div class="box" style="margin-top:15px"><label>Riwayat 10 Foto (Hapus otomatis 7 hari):</label><div id="riwayat"></div></div>
<script>
const API='https:'+'//aihorde.net/api/v2/generate/',KEY='rf_hist_v3',EXP=604800000;let fSel=null;
const $=id=>document.getElementById(id);
$('fImg').onchange=e=>{fSel=e.target.files.item(0);if(!fSel)return;const r=new FileReader();r.onload=v=>{$('prev').src=v.target.result;$('prev').style.display='block';$('bDel').style.display='inline-block';$('mBox').style.display='block'};r.readAsDataURL(fSel)};
$('bDel').onclick=()=>{fSel=null;$('fImg').value='';$('prev').style.display='none';$('bDel').style.display='none';$('mBox').style.display='none'};
function loadH(){const n=Date.now();let d=JSON.parse(localStorage.getItem(KEY)||'[]').filter(x=>n-x.t<EXP);localStorage.setItem(KEY,JSON.stringify(d));$('riwayat').innerHTML=d.length?d.map(x=>`<div><img src="${x.u}">Hapus ${Math.ceil((EXP-(n-x.t))/86400000)} hr lagi</div>`).join(''):'Belum ada riwayat.'}
function saveH(u){const n=Date.now();let d=JSON.parse(localStorage.getItem(KEY)||'[]').filter(x=>n-x.t<EXP);d.unshift({u,t:n});if(d.length>10)d=d.slice(0,10);try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){localStorage.setItem(KEY,JSON.stringify(d.slice(0,4)))}loadH()}
function prepImg(f,w,h){return new Promise(res=>{const r=new FileReader();r.onload=e=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);const u=c.toDataURL('image/webp',.88);res(u.slice(u.indexOf(',')+1))};i.src=e.target.result};r.readAsDataURL(f)})}
function upRes(url,s){return new Promise(res=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>{const w=Math.round(i.width*s),h=Math.round(i.height*s),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(i,0,0,w,h);const tc=document.createElement('canvas');tc.width=300;tc.height=Math.round(300*(i.height/i.width));tc.getContext('2d').drawImage(i,0,0,tc.width,tc.height);res({u:c.toDataURL('image/jpeg',.92),th:tc.toDataURL('image/jpeg',.7),w,h,mp:((w*h)/1e6).toFixed(1)})};i.src=url})}
$('bRun').onclick=async()=>{
  const p=$('prm').value.trim();if(!p)return alert('Isi deskripsi gambar dulu!');
  const [w,h]=$('rasio').value.split(',').map(Number),s=parseFloat($('res').value),g=$('gaya').value;
  $('bRun').disabled=true;$('hasil').innerHTML='';$('stat').innerText='Mengirim perintah...';
  try{
    const pay={prompt:(g?p+', '+g:p)+' ### blurry, low quality, distorted, bad anatomy, extra limbs, ugly, watermark, text',models:['AlbedoBase XL (SDXL)','Juggernaut XL','Deliberate'],params:{width:w,height:h,steps:28,cfg_scale:7.5,sampler_name:'k_dpmpp_2m',karras:true,n:1},nsfw:false};
    if(fSel){pay.source_image=await prepImg(fSel,w,h);pay.source_processing='img2img';pay.params.denoising_strength=$('mode').value==='kar'?0.72:0.45;if($('mode').value==='kar'){pay.params.control_type='canny';pay.params.image_is_control=false}}
    const r=await fetch(API+'async',{method:'POST',headers:{'Content-Type':'application/json','apikey':'0000000000'},body:JSON.stringify(pay)});
    const j=await r.json();if(!j.id)throw new Error(j.message||'Gagal antrean');
    while(true){
      await new Promise(r=>setTimeout(r,3500));
      const c=await(await fetch(API+'status/'+j.id)).json();
      if(c.done&&c.generations&&c.generations.length){
        $('stat').innerText='Meningkatkan resolusi...';
        const raw=c.generations.shift().img,hd=await upRes(raw.startsWith('http')?raw:'data:image/webp;base64,'+raw,s);
        $('hasil').innerHTML=`<img src="${hd.u}"><div style="font-size:12px;color:#aaa;margin-top:5px">${hd.w}x${hd.h} px (~${hd.mp} MP)</div><a class="btn-dl" href="${hd.u}" download="rudyferd-${hd.mp}MP.jpg">Simpan Foto (${hd.mp} MP)</a>`;
        saveH(hd.th);$('stat').innerText='Selesai!';break;
      }
      $('stat').innerText=`Antrean: ${c.queue_position||0} (estimasi ${c.wait_time||20} dtk)`;
    }
  }catch(e){$('stat').innerText='Gagal: '+e.message}finally{$('bRun').disabled=false}
};
loadH();
</script>
</body>
</html>
